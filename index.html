<style>
:root{--bg:#0B1020;--panel:#151B33;--line:#2A3256;--ink:#F2EFE6;--mute:#A7AEC8;--soft:#C9CEE0;--acc:#F2C94C;--cy:#4FD1C5;--co:#FF7A59;--fd:'Chakra Petch',sans-serif;--fb:Inter,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--fb);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#hud .top{position:absolute;left:8px;right:8px;top:calc(env(safe-area-inset-top) + 8px);display:flex;justify-content:space-between;align-items:stretch;gap:8px}
.box{background:rgba(11,16,32,.88);border-radius:12px;padding:5px 9px}
.lbl{font:600 10px var(--fb);letter-spacing:.12em;color:var(--mute)}
.big{font:700 21px/1.05 var(--fd)}
#lives{display:flex;gap:3px;align-items:center}
#lives svg{width:17px;height:17px}
#lives .lost path{fill:none;stroke:#5B6487;stroke-width:1.3}
#lives .last path{fill:var(--co);animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.iconbtn{pointer-events:auto;width:40px;height:44px;border-radius:12px;border:0;background:rgba(11,16,32,.88);color:var(--ink);display:flex;align-items:center;justify-content:center}
#bars{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;align-self:stretch;justify-content:center}
.barrow{display:flex;flex-direction:column;gap:3px;background:rgba(11,16,32,.88);border-radius:9px;padding:4px 8px;font:600 10px var(--fb);color:var(--soft)}
.barrow .bl{display:flex;justify-content:space-between;white-space:nowrap}
.track{height:6px;border-radius:3px;background:#2A3256;position:relative;overflow:hidden}
#lvfill{position:absolute;left:0;top:0;bottom:0;background:var(--cy);border-radius:5px}
.chip{background:rgba(11,16,32,.88);border-radius:10px;padding:5px 9px;font:600 12px var(--fb);color:var(--soft)}
.chip.y{background:var(--acc);color:#0B1020;font-weight:700}
#hud .bot{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px)}
#fuelbar{height:6px;border-radius:3px;background:#2A3256;overflow:hidden;position:relative}
#fuelfill{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:5px}
#fuelbar i{position:absolute;left:25%;top:0;bottom:0;width:2px;background:var(--ink);opacity:.6}
#mbtn{pointer-events:none;width:60px;height:52px;border-radius:12px;border:2px solid #2A3256;background:rgba(11,16,32,.88);color:#5B6487;font:700 18px var(--fd)}
#mbtn.on{border-color:var(--cy);color:#0B1020;background:var(--cy);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;font:700 26px var(--fd);text-shadow:0 2px 8px #000;opacity:0;transition:opacity .25s;white-space:nowrap}
#toast small{display:block;font:600 14px var(--fb);color:var(--soft)}
#ui{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:var(--bg)}
#ui.hide{display:none}
.scr{min-height:100%;max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column;gap:14px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;border-radius:16px;border:0;background:var(--acc);color:#0B1020;font:700 18px var(--fd);letter-spacing:.08em;cursor:pointer}
.btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--ink);font:600 15px var(--fb);letter-spacing:0;min-height:48px}
.btn.cy{background:var(--cy)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.mute{color:var(--mute)}.soft{color:var(--soft)}
h1,h2,h3{margin:0}
.row{display:flex;align-items:center;gap:10px}
.sb{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
textarea{width:100%;min-height:140px;border-radius:14px;border:1px solid var(--cy);background:var(--panel);color:var(--ink);padding:12px 14px;font:500 16px var(--fb);-webkit-user-select:text;user-select:text;resize:vertical}
input[type=text]{width:100%;height:52px;border-radius:14px;border:1px solid var(--cy);background:var(--panel);color:var(--ink);padding:0 16px;font:600 18px var(--fb);-webkit-user-select:text;user-select:text}
.av{width:32px;height:32px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font:700 13px var(--fb);color:#0B1020;object-fit:cover}
.pl{display:flex;align-items:center;gap:10px;border-radius:12px;border:1px solid var(--line);background:var(--panel);padding:8px 12px}
.pl.me{border:2px solid var(--cy);background:#1C2445;padding:7px 11px}
.pl .rk{width:22px;font:700 15px var(--fd);color:var(--mute)}
.pl .nm{flex:1;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;min-width:0}
.pl .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .sc{font:700 16px var(--fd)}
.bb{width:18px;height:18px;border-radius:50%;object-fit:cover;background:#F2EFE6;flex:none}
.photo{width:112px;height:112px;border-radius:50%;border:2px dashed var(--cy);background:var(--panel);color:var(--cy);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:600 12px var(--fb);overflow:hidden;cursor:pointer}
.photo img{width:100%;height:100%;object-fit:cover}
.about h3{font:700 18px var(--fd);color:var(--acc);margin-top:6px}
.about p,.about li{font-size:14px;line-height:1.5;color:var(--soft)}
.about table{width:100%;border-collapse:collapse;font-size:14px}
.about td{padding:6px 4px;border-bottom:1px solid var(--line)}
.about td:last-child{text-align:right;font:700 15px var(--fd);color:var(--ink)}
@keyframes nabiz{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(242,201,76,.55)}50%{transform:scale(1.03);box-shadow:0 0 0 14px rgba(242,201,76,0)}}
.btn.pulse{animation:nabiz 1.8s ease-in-out infinite}
.kar{position:fixed;inset:0;pointer-events:none;overflow:hidden}.kar i{position:absolute;top:-30px;color:#fff;opacity:.85;font-style:normal;animation:kar linear infinite}
@keyframes kar{to{transform:translate(30px,110vh) rotate(200deg)}}
.ylogo{display:flex;flex-direction:column;align-items:center;margin-top:6px}
.ylogo span{font:700 64px/0.95 var(--fd);letter-spacing:.06em;text-shadow:0 5px 0 rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.6);animation:iniş .6s ease-out both}
.ylogo .y1{color:#F2EFE6}.ylogo .y2{color:#E53935;-webkit-text-stroke:2px #fff;paint-order:stroke fill;animation-delay:.15s}
.yjet{filter:drop-shadow(0 10px 18px rgba(0,0,0,.5));animation:iniş .7s ease-out both}
.tdot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px}
.tabs button{min-height:40px;border:0;border-radius:10px;background:transparent;color:var(--soft);font:700 14px var(--fb)}
.tabs button.on{background:var(--acc);color:#0B1020}
.tpick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tpick button{min-height:58px;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font:700 14px var(--fb);display:flex;align-items:center;gap:8px;padding:0 10px;text-align:left}
.tpick button.on{border-color:var(--acc);background:#1C2445}
.rrlogo{position:relative;height:180px;width:250px;margin:0 auto;font:700 168px/1 var(--fd)}
.rrlogo span{position:absolute;top:0;text-shadow:0 6px 0 rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.6)}
.rrlogo .r1{left:12px;color:#F2EFE6}
.rrlogo .r2{left:92px;top:16px;color:#F2C94C;-webkit-text-stroke:3px #0B1020;paint-order:stroke fill}
@keyframes iniş{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
.rrlogo .r1{animation:iniş .6s ease-out both}.rrlogo .r2{animation:iniş .6s .15s ease-out both}
#cover{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(11,16,32,.72);font:700 72px var(--fd);color:var(--acc);pointer-events:none}
#tut{position:fixed;left:0;right:0;display:none;text-align:center;pointer-events:none;font:700 16px var(--fb);text-shadow:0 2px 6px #000}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div class="top">
    <div class="box" style="min-width:84px"><div class="lbl">SKOR</div><div class="big" id="hScore">0</div><div id="hMult" style="font:700 11px var(--fd);color:var(--acc)"></div></div>
    <div id="bars">
      <div class="barrow"><div class="bl"><span style="color:var(--co);font-weight:700">YAKIT</span><span id="hFuel" style="color:var(--ink);font-weight:700"></span></div><div id="fuelbar"><div id="fuelfill"></div><i></i></div></div>
      <div class="barrow"><div class="bl"><span id="hBridge"></span></div><div class="track" aria-label="Bölümün ne kadarı geçildi"><div id="lvfill"></div></div></div>
    </div>
    <div class="row" style="gap:4px">
      <div class="box" id="lives" aria-label="Kalan can"></div>
      <button class="iconbtn" id="pauseBtn" aria-label="Duraklat"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg></button>
    </div>
  </div>
  <div class="bot"><div id="mbtn" role="status" aria-label="İkili atış göstergesi" style="display:flex;align-items:center;justify-content:center">M</div></div>
</div>
<div id="toast"></div>
<div id="cover"></div>
<div id="tut">Uçağa basılı tut ve sürükle<br><span style="font-weight:600;font-size:13px;color:#C9CEE0">Ateş kendiliğinden</span></div>
<div id="ui"></div>

<script>
/* ===================== AYARLAR ===================== */
const DB_URL = "https://sinema-duellosu-default-rtdb.europe-west1.firebasedatabase.app";
const ROOT = "yy";            // Yılbaşı Yarışı'nın kendi alanı (aile oyunlarından ayrı)
const SEZON = "Yılbaşı 2027";  // yarışın adı
const SN = 1;                 // sezon sıra numarası (yeni sezonda artar)
const SURUM = 1;              // otomatik güncelleme numarası
const BITIS = Date.parse('2026-12-31T23:59:59+03:00');   // yarış bitişi (İstanbul saati)
const KONT = 25;              // en fazla oyuncu
const GUN_SINIR = 40;         // kişi başı günde ekibe yazılabilecek en fazla köprü
const EKIPLER = [{id:'a',ad:'Analyze This',c:'#F2C94C'},{id:'s',ad:'Survive the Sleigh',c:'#FF7A59'},{id:'m',ad:'Snow Miners',c:'#9FD3FF'},{id:'c',ad:'SimClaus',c:'#7BD88F'}];
const EK = id => EKIPLER.find(e=>e.id===id) || {id:'',ad:'?',c:'#A7AEC8'};
const bitti = () => Date.now() > BITIS;
const bugun = () => new Date(Date.now()+3*3600e3).toISOString().slice(0,10);   // İstanbul günü
const SADI_YOK = "data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60"><rect width="60" height="60" fill="#1C3A5E"/><path d="M14 40 Q30 6 46 22 L44 40Z" fill="#E53935"/><rect x="10" y="38" width="40" height="9" rx="4" fill="#fff"/><circle cx="46" cy="21" r="5" fill="#fff"/></svg>');
let SADI = "";                // Sadi'nin fotoğrafı ortak tablodan (yy/sadi) okunur
const sadiImg = () => SADI || SADI_YOK;
const TEST = /[?&]test=1/.test(location.search);

/* ===================== ORTAK TABLO (Firebase + bekleyen kayıt kuyruğu) ===================== */
let S = { meta:{}, players:{}, log:[], ver:0 };
let ME = localStorage.getItem('yy_id') || '';
let Q = []; try{ Q = JSON.parse(localStorage.getItem('yy_bekleyen'))||[]; }catch(e){}
function qSave(){ try{ localStorage.setItem('yy_bekleyen', JSON.stringify(Q)); }catch(e){} }
function put(path,val){ Q = Q.filter(x=>x[0]!==path); Q.push([path,val]); qSave(); return flush(); }
let flushing=null, offWarn=0;
function flush(){ if(flushing) return flushing; flushing=(async()=>{
  while(Q.length){ const [p,v]=Q[0];
    try{ const r=await fetch(`${DB_URL}/${ROOT}/${p}.json`,{method:'PUT',body:JSON.stringify(v)}); if(!r.ok) throw 0; }
    catch(e){ if(Date.now()-offWarn>30000){ offWarn=Date.now(); toast('Bağlantı yok','Kaydın telefonda bekliyor'); } break; }
    if(Q[0]&&Q[0][0]===p&&Q[0][1]===v) Q.shift(); qSave(); }
})().finally(()=>{flushing=null;}); return flushing; }
setInterval(()=>{ if(Q.length) flush(); },15000); addEventListener('online',()=>flush());
async function sync(){
  try{ if(Q.length) await flush(); const r=await fetch(`${DB_URL}/${ROOT}.json`,{cache:'no-store'}); if(!r.ok) throw 0;
    const d=(await r.json())||{}; if(d.sadi) SADI=d.sadi; S={meta:d.meta||{},players:d.players||{},log:Object.values(d.log||{}).filter(x=>x&&x.t).sort((a,b)=>a.t-b.t).slice(-40),ver:+d.ver||0,codes:d.codes||{},tsadi:d.tsadi||{}};
    // bekleyen kayıtları yerel görünüme uygula
    for(const [p,v] of Q){ const k=p.split('/'); if(k[0]==='players'&&k.length===2){ if(v===null) delete S.players[k[1]]; else S.players[k[1]]=v; } }
    checkVer(); return true;
  }catch(e){ return false; }
}
function logEv(m){ const e={t:Date.now(),m}; S.log=(S.log||[]).concat(e).slice(-40); put('log/'+e.t.toString(36)+Math.random().toString(36).slice(2,5),e); }
const P = () => S.players[ME];
function savePlayer(){ if(ME&&P()) put('players/'+ME, P()); }

/* Otomatik güncelleme: veritabanındaki 'ver' büyükse, oyun sırasında değilken sayfa kendini yeniler */
function checkVer(){ const v=+S.ver||0; if(v<=SURUM||(G.running&&!G.demo)) return;
  const k='yy_yenilendi_'+v; try{ if(sessionStorage.getItem(k)) return; sessionStorage.setItem(k,'1'); }catch(e){}
  toast('Yeni sürüm geldi','yenileniyor…'); setTimeout(()=>location.replace(location.pathname+'?v='+v),1200); }
async function verPoll(){ if(document.hidden) return; try{ const v=await fetch(`${DB_URL}/${ROOT}/ver.json`,{cache:'no-store'}).then(r=>r.json()); S.ver=+v||0; checkVer(); }catch(e){} }
setInterval(verPoll,60000); addEventListener('pageshow',verPoll);
if('serviceWorker' in navigator && !TEST) navigator.serviceWorker.register('sw.js').catch(()=>{});

/* Sezon: kodda yeni sezon numarası varsa, ilk açan eski sezonu kapatır, ilk üçü şeref kürsüsüne yazar */
function seasonCheck(){
  const m=S.meta||{};
  if((+m.sn||0)>=SN) return;
  const top=Object.values(S.players).filter(p=>p.best>0).sort((a,b)=>b.best-a.best).slice(0,3).map(p=>({n:p.name,s:p.best}));
  const champs=(m.champs||[]).concat(m.sn?[{sezon:m.season,top}]:[]);
  S.meta={sn:SN,season:SEZON,start:Date.now(),champs};
  put('meta',S.meta);
  for(const id in S.players){ Object.assign(S.players[id],{best:0,bestLv:0,birce:false,badge:false,runs:0,kb:0,days:{}}); put('players/'+id,S.players[id]); }
  logEv(`${SEZON} başladı`);
}

/* Satırlar: L,R = kıyılar; IL,IR = ada (yoksa 0) */

const sectionInfo=[];     // her bölüm parçası için: köprü satırı, ada bilgisi
function genSection(s){
  const r=rng(SEED+s*7919), lv=levelOfSection(s), r0=s*SR;
  const minHW=Math.max(70,112-lv*4), maxHW=Math.max(110,160-lv*3);
  let cx=195, hw=72;
  const keys=[]; // kontrol noktaları
  keys.push([0,195,72],[6,195,72]);
  let row=14;
  // üçlü geçit (2. bölümden) ve köprü öncesi boğaz: her parça için sabit, her oyunda aynı yerde
  const tri = s>0 && lv>=2 && r()<Math.min(.55,.2+.05*lv);
  const strait = s>0 && r()<Math.min(.5,.14+.05*lv);
  const isl = { start:0, end:0, narrowLeft:r()<.5, tri, mined:-1 };
  const islStart = strait? 34+Math.floor(r()*8) : 46+Math.floor(r()*14), islLen = strait? 26+Math.floor(r()*6) : 30+Math.floor(r()*10);
  isl.start=islStart; isl.end=islStart+islLen;
  const endRow = strait? SR-38 : SR-14;
  while(row<endRow){
    if(row>=islStart-6 && row<=isl.end+4){ keys.push([islStart-6,195,150],[isl.end+4,195,150]); row=isl.end+12; continue; }
    cx=Math.max(150,Math.min(240,cx+(r()-.5)*90)); hw=minHW+r()*(maxHW-minHW);
    if(row+8>islStart-6 && row<islStart-6){ row=islStart-6; continue; }
    keys.push([row,cx,hw]); row+=8+Math.floor(r()*6);
  }
  if(strait){ const c1=195+(r()-.5)*70, c2=195+(r()-.5)*56; keys.push([SR-32,c1,46],[SR-12,c2,44],[SR-6,195,72],[SR,195,72]); }
  else keys.push([SR-10,195,72],[SR,195,72]);
  keys.sort((a,b)=>a[0]-b[0]);
  for(let i=0;i<SR;i++){
    let k=0; while(k<keys.length-2&&keys[k+1][0]<=i) k++;
    const a=keys[k], b=keys[k+1]; const t=b[0]===a[0]?0:Math.min(1,Math.max(0,(i-a[0])/(b[0]-a[0])));
    const e=t*t*(3-2*t); const c=a[1]+(b[1]-a[1])*e, w=a[2]+(b[2]-a[2])*e;
    const ri=r0+i; rows.L[ri]=Math.round(c-w); rows.R[ri]=Math.round(c+w); rows.IL[ri]=0; rows.IR[ri]=0; rows.JL[ri]=0; rows.JR[ri]=0;
  }
  const nar=78;
  for(let i=isl.start;i<isl.end;i++){
    const ri=r0+i, L=rows.L[ri], R=rows.R[ri];
    const edge=Math.min(1,Math.min(i-isl.start,isl.end-1-i)/5);   // uçları sivri
    if(tri){ // üç kanal: 76 + ada 36 + 76 + ada 36 + 76
      const c=76, w=(R-L-3*c)/2, sh=(1-edge)*Math.min(15,w/2-2);
      rows.IL[ri]=Math.round(L+c+sh); rows.IR[ri]=Math.round(L+c+w-sh); rows.JL[ri]=Math.round(L+2*c+w+sh); rows.JR[ri]=Math.round(L+2*c+2*w-sh); }
    else if(isl.narrowLeft){ const il=L+nar, ir=R-130; rows.IL[ri]=Math.round(il+(1-edge)*20); rows.IR[ri]=Math.round(ir-(1-edge)*20); }
    else { const ir=R-nar, il=L+130; rows.IL[ri]=Math.round(il+(1-edge)*20); rows.IR[ri]=Math.round(ir-(1-edge)*20); }
  }

  sectionInfo[s]={bridgeRow:r0+SR-4, isl:{start:r0+isl.start,end:r0+isl.end,narrowLeft:isl.narrowLeft,tri,mined:isl.mined}, lv, strait};
  genUpTo=Math.max(genUpTo,s);
}
function ensureRows(uptoRow){ while((genUpTo+1)*SR<=uptoRow+SR) genSection(genUpTo+1); }
function bounds(wy){ const f=wy/ROW, i=Math.max(0,Math.floor(f)), t=f-i; ensureRows(i+2);
  const g=(A)=>A[i]+(A[i+1]-A[i])*t;
  let IL=0,IR=0,JL=0,JR=0; if(rows.IL[i]&&rows.IL[i+1]){ IL=g(rows.IL); IR=g(rows.IR); } if(rows.JL[i]&&rows.JL[i+1]){ JL=g(rows.JL); JR=g(rows.JR); }
  return {L:g(rows.L),R:g(rows.R),IL,IR,JL,JR}; }
/* su kanalları: [sol,sağ] aralıkları (ada yoksa 1, tek adada 2, üçlü geçitte 3) */
function segs(b){ const a=[]; let x=b.L; if(b.IL){ a.push([x,b.IL]); x=b.IR; } if(b.JL){ a.push([x,b.JL]); x=b.JR; } a.push([x,b.R]); return a; }
function inWater(b,x){ if(x<b.L||x>b.R) return false; if(b.IL&&x>b.IL&&x<b.IR) return false; if(b.JL&&x>b.JL&&x<b.JR) return false; return true; }
function chanOf(b,x){ const a=segs(b); for(const c of a) if(x<=c[1]) return c; return a[a.length-1]; }

/* Varlıklar: tekne, helikopter, jet, yakıt, M, köprü */
let ents=[];
function spawnSection(s){
  ensureRows((s+1)*SR+2); const info=sectionInfo[s]; const r=rng(SEED+s*104729), lv=info.lv, r0=s*SR;
  const yOf=row=>row*ROW;
  // köprü: daha dayanıklı; yıkılınca iki yanda ayakları kalır, aradaki boşluktan geçilir
  const hp=Math.min(18,10+(lv-1)), by=yOf(info.bridgeRow), bb=bounds(by), gap=Math.max(80,112-(lv-1)*4);
  const gc=(bb.L+bb.R)/2+(r()-.5)*Math.max(0,bb.R-bb.L-gap-16);
  ents.push({t:'bridge',s,y:by,hp,max:hp,alive:true,gl:gc-gap/2,gr:gc+gap/2});
  const im=Math.floor((info.isl.start+info.isl.end)/2), b=bounds(yOf(im));
  if(info.isl.tri){
    const ch=segs(b).map(c=>(c[0]+c[1])/2), m=info.isl.mined;
    const free=[0,1,2].filter(i=>i!==m), fi=free[Math.floor(r()*free.length)];
    ents.push({t:'fuel',s,x:ch[fi],y:yOf(im+2),alive:true});
    const oi=free.find(i=>i!==fi); if(oi!==undefined&&r()<.3) ents.push({t:'ammo',s,x:ch[oi],y:yOf(im),alive:true});
    if(m>=0){ const len=info.isl.end-info.isl.start; for(const f of [.55,.75]){ const row=info.isl.start+Math.floor(len*f), bm=bounds(yOf(row)), c=segs(bm)[m]; if(c) ents.push({t:'mine',s,x:(c[0]+c[1])/2,y:yOf(row),alive:true}); } }
  } else {
    // ada ikilemi: dar kanalda M, geniş kanalda yakıt
    const narrowX = info.isl.narrowLeft ? (b.L+b.IL)/2 : (b.IR+b.R)/2;
    const wideX = info.isl.narrowLeft ? (b.IR+b.R)/2 : (b.L+b.IL)/2;
    if(r()<.3) ents.push({t:'ammo',s,x:narrowX,y:yOf(im),alive:true});
    ents.push({t:'fuel',s,x:wideX,y:yOf(im+2),alive:true});
  }
  const extraFuel = lv<=3?2:(lv<=7?1:(r()<.5?1:0));
  for(let k=0;k<extraFuel;k++){ const row=r0+12+Math.floor(r()*(info.isl.start-r0-20>10?info.isl.start-r0-20:20)); placeIn(r,'fuel',s,row); }
  // düşmanlar: her biri farklı hızda (duran, yavaş, normal, hızlı)
  const spd=()=>{ const q=r(); return q<.15?0:q<.4?18+r()*22:q<.85?45+r()*45:100+r()*50; };
  const n=4+lv+Math.floor(r()*3), lastRow=info.strait? SR-34 : SR-14;
  for(let k=0;k<n;k++){
    const row=r0+12+Math.floor(r()*(lastRow-12));
    const roll=r(); let t='boat';
    if(lv>=2&&roll<.22) t='jet'; else if(roll<.6) t='heli';
    if(t==='jet'){ ents.push({t,s,y:yOf(row),x:r()<.5?-50:W+50,vx:0,dir:r()<.5?1:-1,spd:150+r()*170+lv*8,bomb:true,back:0,wait:0,alive:true,armed:false}); continue; }
    let v=spd(), ex={};
    if(t==='heli'&&lv>=5&&r()<.35){ v=0; ex={amb:true}; }            // pusu helikopteri: bekler, yaklaşınca fırlar
    if(t==='boat'&&lv>=6&&r()<.4){ v=160+r()*40; ex={fast:true}; }    // sürat botu
    else if(v>0) v+=lv*4;
    placeIn(r,t,s,row,v*(r()<.5?-1:1),ex);
  }
  // kıyı tankları (4. bölümden): kıyıda durur, uçağa nişan alıp ateş eder
  if(lv>=4){ const nt=1+(lv>=7?1:0)+(r()<.5?1:0);
    for(let k=0;k<nt;k++){ const row=r0+16+Math.floor(r()*(SR-40)), wy=yOf(row), bt=bounds(wy), left=r()<.5, x=left?bt.L-26:bt.R+26;
      if(x>14&&x<W-14) ents.push({t:'tank',s,x,y:wy,left,cd:.6,shots:0,alive:true,ang:left?0:Math.PI}); } }
}
function placeIn(r,t,s,row,vx=0,ex){ const wy=row*ROW, b=bounds(wy), sg=segs(b), c=sg[Math.floor(r()*sg.length)];
  const lo=c[0]+22, hi=c[1]-22;
  if(hi-lo<10) return; ents.push(Object.assign({t,s,x:lo+r()*(hi-lo),y:wy,vx,alive:true},ex||{})); }

let last=0;
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(t-last)/1000||0); last=t;
  if(!G.running) return;
  if(!G.paused){ const n=TEST?(window.__ts||1):1; for(let i=0;i<n&&G.running&&!G.paused;i++) step(dt); }
  draw();
}
requestAnimationFrame(loop);

function step(dt){
  G.time+=dt;
  if(G.flash>0) G.flash-=dt;
  for(const l of G.lines) l.t-=dt; G.lines=G.lines.filter(l=>l.t>0);
  // parçacıklar
  for(const p of G.parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.l-=dt; } G.parts=G.parts.filter(p=>p.l>0);
  if(G.dead){ G.dead-=dt; if(G.dead<=0) afterDeath(); return; }
  if(!G.started){ return; }                     // öğretici: ilk dokunuşa kadar bekler
  if(G.inv>0) G.inv-=dt;
  // uçak hareketi
  const yMin=H*.5, yMax=H-90;
  G.ty=Math.max(yMin,Math.min(yMax,G.ty)); G.tx=Math.max(14,Math.min(W-14,G.tx));
  const mv=520*dt, dx=G.tx-G.px, dy=G.ty-G.py, d=Math.hypot(dx,dy);
  if(d>0){ const k=Math.min(1,mv/d); G.px+=dx*k; G.py+=dy*k; }
  // hız: uçak yukarıdaysa nehir daha hızlı akar
  const up=1-(G.py-yMin)/(yMax-yMin);
  const speed=BASE_SPEED*(1+0.04*(G.lv-1))*(0.75+0.75*up);
  G.camY+=speed*dt;
  const pwy=playerWY();
  ensureRows(Math.floor((G.camY+H+200)/ROW));
  // yeni parçaların varlıklarını üret
  const secAhead=Math.floor((G.camY+H+400)/(SR*ROW)); while(G.spawnedTo<secAhead){ G.spawnedTo++; spawnSection(G.spawnedTo); }
  if(ents.length>40) ents=ents.filter(e=>e.y>G.camY-300);
  // yakıt
  G.fuel-=(2.4+0.08*(G.lv-1))*dt;
  if(G.fuel<25&&G.time-G.lowBeep>.9){ G.lowBeep=G.time; SND.low(); }
  if(G.fuel<=0){ G.fuel=0; return crash('Yakıt bitti'); }
  // ateş
  G.lastFire-=dt; if(G.lastFire<=0){ G.lastFire=.13; if(G.dbl>0) G.bullets.push({x:G.px-6,y:pwy+20},{x:G.px+6,y:pwy+20}); else G.bullets.push({x:G.px,y:pwy+22}); if(Math.random()<.35) SND.shot(); }
  if(G.dbl>0){ G.dbl-=dt; if(G.dbl<=0){ G.dbl=0; toast('İkili atış bitti'); } }
  for(const b of G.bullets) b.y+=620*dt;
  G.bullets=G.bullets.filter(b=>b.y<G.camY+H-72&&!b.dead);   // üst panelin altında yok olur: görünmeyen hedef vurulmaz
  // varlıklar
  for(const e of ents){ if(!e.alive) continue;
    if(e.t==='jet'&&e.wait>0){ e.wait-=dt; e.y=pwy+e.off; if(e.wait<=0){ e.armed=true; e.x=e.dir>0?-50:W+50; } continue; }   // dönüşe hazırlanan jet
    const sy=scrY(e.y); if(sy<-80||sy>H+80){ if(e.t==='jet'&&sy>H+80) e.alive=false; continue; }
    if(e.t==='boat'||e.t==='heli'){
      if(e.amb&&!e.go&&e.y-pwy<270){ e.go=true; e.vx=(G.px>e.x?1:-1)*(230+G.lv*6); }   // pusu: aniden fırlar
      e.x+=e.vx*dt; const c=chanOf(bounds(e.y),e.x); let lo=c[0]+16, hi=c[1]-16; if(hi<lo){ lo=hi=(c[0]+c[1])/2; }
      if(e.x<lo){e.x=lo;e.vx=Math.abs(e.vx);} if(e.x>hi){e.x=hi;e.vx=-Math.abs(e.vx);} if(e.t==='heli') e.rot=(e.rot||0)+dt*30; }
    if(e.t==='jet'){ if(!e.armed&&sy>-10){ e.armed=true; e.x=e.dir>0?-50:W+50; }
      if(e.armed){ e.x+=e.dir*e.spd*dt;
        // tek bomba: oyuncunun hizasından geçerken bırakır
        if(e.bomb&&sy>40&&sy<G.py-110&&Math.abs(e.x-G.px)<22){ e.bomb=false; const T=1.1;
          G.bombs.push({sx:e.x,sy:e.y,x:G.px,y:pwy+speed*T,t:0,T,ex:false}); SND.drop(); }
        // vurulmadan çıkarsa 1-2 sn sonra yandan geri döner, bu kez uçağın hizasından
        if(e.x<-70||e.x>W+70){ if(!e.back){ e.back=1; e.armed=false; e.dir*=-1; e.wait=1+Math.random(); e.off=Math.random()*34; e.spd*=1.1; e.y=pwy+e.off; } else e.alive=false; } } }
    if(e.t==='tank'){ const dyp=e.y-pwy; e.ang=Math.atan2(-(pwy-e.y),G.px-e.x);
      if(dyp>60&&dyp<480&&e.shots<2&&G.inv<=0){ e.cd-=dt; if(e.cd<=0){ e.cd=2; e.shots++;
        const ty=pwy+speed*.9, d=Math.hypot(G.px-e.x,ty-e.y)||1, v=200; G.shells.push({x:e.x,y:e.y,vx:(G.px-e.x)/d*v,vy:(ty-e.y)/d*v,l:3.5}); SND.tank(); } } }
  }
  // bombalar ve tank mermileri
  for(const m of G.bombs){ m.t+=dt; if(!m.ex&&m.t>=m.T){ m.ex=true; boom(m.x,m.y,'#FF7A59'); boom(m.x,m.y,'#F2C94C'); SND.bomb(); } }
  G.bombs=G.bombs.filter(m=>m.t<m.T+.6);
  for(const h of G.shells){ h.x+=h.vx*dt; h.y+=h.vy*dt; h.l-=dt; } G.shells=G.shells.filter(h=>h.l>0);
  // mermi çarpışmaları
  for(const b of G.bullets){
    const bb=bounds(b.y); if(!inWater(bb,b.x)){ b.dead=true; continue; }   // kıyıya çarpan mermi kaybolur
    for(const e of ents){
      if(e.t==='bridge'&&!e.alive){ if(Math.abs(b.y-e.y)<14&&(b.x<e.gl||b.x>e.gr)){ b.dead=true; break; } continue; }   // köprü ayağı
      if(!e.alive) continue;
      if(e.t==='bridge'){ if(Math.abs(b.y-e.y)<14){ b.dead=true; e.hp--; SND.hit(); e.hitT=.12; if(e.hp<=0){ e.alive=false; const p=addScore(PTS.bridge); SND.bridge(); vib(60); for(let i=0;i<26;i++) G.parts.push(part(e.gl+Math.random()*(e.gr-e.gl),e.y,'#F2C94C')); toast('Köprü yıkıldı','+'+fmt(p)+' · ayaklar arasından geç'); } break; } continue; }
      if(e.t==='ammo'||e.t==='fuel'||e.t==='mine'||e.t==='tank') continue;   // mayın su altında, tank kıyıda: vurulmaz
      if(e.t==='jet'&&(!e.armed||e.wait>0)) continue;
      const hw=e.t==='jet'?24:18, hh=14;
      if(Math.abs(b.x-e.x)<hw&&Math.abs(b.y-e.y)<hh){ b.dead=true; e.alive=false; const p=addScore(PTS[e.t]); boom(e.x,e.y,'#F2C94C'); SND.boom(); break; }
    }
  }
  // uçak çarpışmaları
  if(G.inv<=0){
    const pts=[[0,-22],[-19,6],[19,6],[-8,16],[8,16],[0,18]];
    for(const [ox,oy] of pts){ const wx=G.px+ox, wy=pwy-oy, b=bounds(wy);
      if(!inWater(b,wx)) return crash('Kıyıya çarptın'); }
    for(const m of G.bombs) if(m.ex&&m.t<m.T+.3&&Math.hypot(G.px-m.x,pwy-m.y)<36) return crash('Bomba isabet etti');
    for(const h of G.shells) if(Math.hypot(G.px-h.x,pwy-h.y)<13) return crash('Tank mermisi');
    for(const e of ents){
      if(e.t==='bridge'){ if(Math.abs(pwy-e.y)<16){ if(e.alive) return crash('Köprüye çarptın'); if(G.px-17<e.gl||G.px+17>e.gr) return crash('Köprü ayağına çarptın'); } continue; }
      if(!e.alive) continue;
      const dx=Math.abs(e.x-G.px), dy=Math.abs(e.y-pwy);
      if(e.t==='fuel'){ if(dx<26&&dy<32){ if(G.fuel<100){ G.fuel=Math.min(100,G.fuel+38*dt); if(Math.random()<.2) SND.fuel(); } } continue; }
      if(e.t==='ammo'){ if(dx<26&&dy<26){ e.alive=false; G.dbl=DBL_SURE; SND.pick(); toast('M alındı',DBL_SURE+' saniye ikili atış'); } continue; }
      if(e.t==='mine'){ if(dx<22&&dy<22) return crash('Mayına çarptın'); continue; }
      if(e.t==='tank') continue;
      if(e.t==='jet'&&(!e.armed||e.wait>0)) continue;
      const hw=e.t==='jet'?26:20; if(dx<hw&&dy<16) return crash(e.t==='heli'?'Helikoptere çarptın':e.t==='jet'?'Uçağa çarptın':'Tekneye çarptın');

  }

  for(const e of ents){ if(e.t==='bridge'&&!e.alive&&!e.passed&&pwy>e.y+10){ e.passed=true; passBridge(e.s); } }
  G.secNow=Math.floor(pwy/(SR*ROW)); G.lv=levelOfSection(G.secNow);
  hud();
}
function passBridge(s){
  G.bridges++; G.ck=s+1;
  const fb=Math.round(G.fuel*5); G.score+=fb;
  G.mult=Math.min(5,G.mult+1);

    const bonus=2000*lvNow; G.score+=bonus; G.lives=Math.min(3,G.lives+1); SND.bonus();
    toast(`Bölüm ${lvNow} tamam`,`+${fmt(bonus)} · +1 can · Sıradaki: ${LV[Math.min(10,lvNext)].ad}${YENI[lvNext]?' · Yeni: '+YENI[lvNext]:''}`);
  } else toast(`Köprü geçildi · ×${G.mult}`,`yakıt bonusu +${fb}`);
  if(TEST) window.__events.push('bridge'+s);
}

function crash(why){

function draw(){

  for(let r=r0;r<=r1;r+=3){ const h=hash(r); if(h%3) continue; const x=rows.L[r]+(h%1000)/1000*(rows.R[r]-rows.L[r]); const y=scrY(r*ROW); ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-3,y-30); ctx.stroke(); }
  // kıyılar
  const side=(arr,sign,off,col)=>{ ctx.fillStyle=col; ctx.beginPath(); const edge=sign<0?0:W; ctx.moveTo(edge,scrY(r0*ROW)); for(let r=r0;r<=r1;r++) ctx.lineTo(arr[r]+off*sign,scrY(r*ROW)); ctx.lineTo(edge,scrY(r1*ROW)); ctx.closePath(); ctx.fill(); };

  // adalar (üçlü geçitte iki ada)
  for(const [A,B] of [[rows.IL,rows.IR],[rows.JL,rows.JR]]){ let r=r0; while(r<=r1){ if(!A[r]){ r++; continue; } let e=r; while(e<=r1+20&&A[e]) e++;
    ctx.fillStyle=pal.k; ctx.beginPath(); ctx.moveTo(A[r],scrY(r*ROW)); for(let i=r;i<e;i++) ctx.lineTo(A[i],scrY(i*ROW)); for(let i=e-1;i>=r;i--) ctx.lineTo(B[i],scrY(i*ROW)); ctx.closePath(); ctx.fill();
    ctx.fillStyle=pal.kd; ctx.beginPath(); for(let i=r;i<e;i++) ctx.lineTo(A[i]+Math.min(10,(B[i]-A[i])/3),scrY(i*ROW)); for(let i=e-1;i>=r;i--) ctx.lineTo(B[i]-Math.min(10,(B[i]-A[i])/3),scrY(i*ROW)); ctx.closePath(); ctx.fill();
    r=e; } }
  // ağaçlar / süs
  for(let r=r0;r<=r1;r++){ const h=hash(r*31+7); if(h%4) continue; const left=h&16; const y=scrY(r*ROW);
    const x=left? rows.L[r]-40-(h>>>8)%60 : rows.R[r]+40+(h>>>8)%60; if(x<6||x>W-6) continue; const rad=9+(h>>>12)%8;
    if(h%5===2) geyik(x,y,(h&32)?1:-1); else cam(x,y,rad+5); }
  // varlıklar
  for(const e of ents){ const y=scrY(e.y); if(y<-80||y>H+80) continue;
    if(e.t==='bridge'){ const b=bounds(e.y);
      if(e.alive){ ctx.fillStyle=e.hitT>0?'#5B6487':'#2A3256'; ctx.fillRect(b.L-30,y-13,b.R-b.L+60,26); ctx.strokeStyle='#5B6487'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(b.L-30,y-13); ctx.lineTo(b.R+30,y-13); ctx.moveTo(b.L-30,y+13); ctx.lineTo(b.R+30,y+13); ctx.stroke();
        ctx.fillStyle='rgba(242,201,76,.85)'; ctx.fillRect(b.L-30,y-2,b.R-b.L+60,4);
        for(let lx=b.L-24,k=0;lx<b.R+30;lx+=14,k++){ const on=(k+Math.floor(G.time*3))%3; ctx.fillStyle=['#E53935','#7BD88F','#F2C94C'][on]; ctx.beginPath(); ctx.arc(lx,y-13,2.6,0,7); ctx.arc(lx+7,y+13,2.6,0,7); ctx.fill(); }
        if(e.hp<e.max){ ctx.fillStyle='#0B1020'; rr(170,y-30,50,8,3); ctx.fill(); ctx.fillStyle='#FF7A59'; rr(170,y-30,50*e.hp/e.max,8,3); ctx.fill(); }
        if(e.hitT>0) e.hitT-=1/60; }
      else { // yıkık köprü: iki yanda ayaklar, kırık uçlar
        for(const [x0,x1,dir] of [[b.L-30,e.gl,1],[e.gr,b.R+30,-1]]){ ctx.fillStyle='#2A3256'; ctx.beginPath(); ctx.moveTo(x0,y-13);
          if(dir>0){ ctx.lineTo(x1-4,y-13); ctx.lineTo(x1,y-6); ctx.lineTo(x1-5,y+1); ctx.lineTo(x1+1,y+7); ctx.lineTo(x1-3,y+13); ctx.lineTo(x0,y+13); }
          else { ctx.lineTo(x1,y-13); ctx.lineTo(x1,y+13); ctx.lineTo(x0+3,y+13); ctx.lineTo(x0-1,y+7); ctx.lineTo(x0+5,y+1); ctx.lineTo(x0,y-6); ctx.lineTo(x0+4,y-13); }
          ctx.closePath(); ctx.fill(); ctx.strokeStyle='#5B6487'; ctx.lineWidth=3; ctx.stroke();
          ctx.strokeStyle='#C9CEE0'; ctx.lineWidth=1.5; ctx.beginPath(); const tip=dir>0?x1:x0; ctx.moveTo(tip,y-8); ctx.lineTo(tip+dir*7,y-11); ctx.moveTo(tip,y+5); ctx.lineTo(tip+dir*8,y+9); ctx.stroke(); } }
      continue; }
    if(!e.alive) continue;
    if(e.t==='boat'){ boat(e.x,y,e.vx); if(e.fast){ ctx.strokeStyle='rgba(191,243,238,.7)'; ctx.lineWidth=2; const k=e.vx<0?1:-1; ctx.beginPath(); ctx.moveTo(e.x+k*30,y-8); ctx.lineTo(e.x+k*70,y-20); ctx.moveTo(e.x+k*30,y+8); ctx.lineTo(e.x+k*70,y+20); ctx.stroke(); } }
    else if(e.t==='heli'){ heli(e.x,y,e.rot||0); if(e.amb&&!e.go&&Math.floor(G.time*4)%2){ ctx.fillStyle='#FF3B30'; ctx.beginPath(); ctx.arc(e.x,y+4,3.5,0,7); ctx.fill(); } }
    else if(e.t==='fuel') fuelDepot(e.x,y); else if(e.t==='ammo') ammo(e.x,y,G.time);

    else if(e.t==='jet'&&e.armed) jet(e.x,y,.5,PAL_EN,e.dir>0?Math.PI/2:-Math.PI/2);
  }
  // bombalar: hedef dairesi küçülür, bomba hedefe süzülür

    if(!m.ex){ const k=m.t/m.T, rad=36+(1-k)*24; ctx.strokeStyle=Math.floor(m.t*10)%2?'#FF3B30':'#FF7A59'; ctx.lineWidth=2.5; ctx.setLineDash([6,5]); ctx.beginPath(); ctx.arc(m.x,ty,rad,0,7); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle='rgba(255,59,48,.14)'; ctx.beginPath(); ctx.arc(m.x,ty,36,0,7); ctx.fill();
      const bx=m.sx+(m.x-m.sx)*k, byw=m.sy+(m.y-m.sy)*k, by=scrY(byw), sc=1.4-k*.6; ctx.save(); ctx.translate(bx,by); ctx.scale(sc,sc); ctx.fillStyle='#1A2238'; ctx.beginPath(); ctx.ellipse(0,0,4,8,0,0,7); ctx.fill(); ctx.fillStyle='#FF7A59'; ctx.fillRect(-4,-10,8,3); ctx.restore(); }
    else { const a=1-(m.t-m.T)/.6; ctx.fillStyle=`rgba(255,122,89,${a*.5})`; ctx.beginPath(); ctx.arc(m.x,ty,36,0,7); ctx.fill(); } }
  for(const h of G.shells){ const y=scrY(h.y); ctx.strokeStyle='rgba(255,59,48,.65)'; ctx.lineWidth=4; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(h.x,y); ctx.lineTo(h.x-h.vx*.09,y+h.vy*.09); ctx.stroke();
    ctx.fillStyle='rgba(255,59,48,.35)'; ctx.beginPath(); ctx.arc(h.x,y,9+Math.sin(G.time*20)*2,0,7); ctx.fill(); ctx.fillStyle='#FF3B30'; ctx.beginPath(); ctx.arc(h.x,y,5,0,7); ctx.fill(); ctx.fillStyle='#FFFFFF'; ctx.beginPath(); ctx.arc(h.x,y,2.2,0,7); ctx.fill(); }
  // geri dönecek jet: kenarda uyarı oku
  for(const e of ents){ if(e.t!=='jet'||!(e.wait>0)||e.wait>.9||Math.floor(G.time*8)%2) continue; const y=G.py-e.off, x=e.dir>0?6:W-6, d=e.dir>0?1:-1;

}

function gameOver(){
  G.running=false; G.over=true; $('#hud').style.display='none'; $('#tut').style.display='none';
  const p=P(); const sc=Math.round(G.score); let rek=false, katki=0;
  const plausible = sc <= 400 + G.time*900;   // bariz hile koruması
  if(p&&plausible&&!bitti()){
    const L0=leader().map(([id])=>id), myOld=L0.indexOf(ME), T0=teamStats()[0];
    // ekip katkısı: bu oyunda yeni geçilen köprüler, günlük sınıra kadar
    const k=bugun(); p.days=p.days||{}; const yeni=Math.max(0,G.bridges-G.cBr); G.cBr=G.bridges;
    katki=Math.max(0,Math.min(yeni,GUN_SINIR-(p.days[k]||0))); p.days[k]=(p.days[k]||0)+katki; p.kb=(p.kb||0)+katki;
    p.lastScore=sc; if(sc>(p.best||0)){ p.best=sc; p.bestLv=G.lv; p.bestAt=Date.now(); rek=true; }
    savePlayer();
    const L1=leader().map(([id])=>id), myNew=L1.indexOf(ME);
    if(rek&&myOld>=0&&myNew<myOld){ const gecilen=S.players[L0[myNew]]; logEv(myNew===0?`${p.name} zirveye çıktı: ${fmt(sc)}`:`${p.name}, ${gecilen?gecilen.name:''} adlı oyuncuyu geçti`); }
    else if(rek) logEv(`${p.name} rekor kırdı: ${fmt(sc)}`);
    const T1=teamStats()[0]; if(T0&&T1&&T0.id!==T1.id&&T1.kb>0) logEv(`${T1.ad} ekibi öne geçti!`);

  board({over:true,score:sc,rek,katki});
}

function readPhoto(f,cb){ if(!f) return; const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'), s=112; c.width=c.height=s; const x=c.getContext('2d');
  const m=Math.min(img.width,img.height); x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s); cb(c.toDataURL('image/jpeg',.72)); URL.revokeObjectURL(img.src); }; img.src=URL.createObjectURL(f); }
function uniqName(n,except){ const taken=new Set(Object.entries(S.players).filter(([id])=>id!==except).map(([,p])=>(p.name||'').toLocaleLowerCase('tr')));
  if(!taken.has(n.toLocaleLowerCase('tr'))) return n; for(const c of 'BCDEFGHİJKLMNOPRSTUVYZ'){ const t=n+' '+c; if(!taken.has(t.toLocaleLowerCase('tr'))) return t; } return n+' '+Date.now()%100; }

  savePlayer(); put('codes/'+code,id); logEv(`${n}, ${EK(team).ad} ekibine katıldı`);

    <p><b>Hesap:</b> puan = hedef puanı × bölüm katsayısı × seri çarpanı. Bölüm katsayısı her bölüm %20 artar (×1,0 … ×2,8). Seri çarpanı: ölmeden geçilen her köprü +1 (en fazla ×5); can gidince ×1.<br><b>Bonuslar:</b> dar geçit +250 · köprüde kalan yakıt yüzdesi × 5 · bölüm sonu 2.000 × bölüm no.<br>Kişisel tabloda yarış boyunca tek oyundaki en yüksek puanın görünür.</p>
    <h3>Ekip puanı</h3><p>Dört ekip yarışır: ${EKIPLER.map(e=>e.ad).join(', ')}. Ekip katılırken seçilir, sonradan değişmez.</p>
    <p><b>Hesap:</b> ekip puanı = üyelerin ekibe yazdığı köprülerin toplamı ÷ ekipteki kişi sayısı. Ortalama alındığı için kalabalık ekip avantajlı olmaz.<br>Her oyunda geçtiğin köprüler ekibine yazılır; kişi başı günde en çok ${GUN_SINIR} köprü sayılır (gün İstanbul saatiyle gece yarısı yenilenir). Böylece bir kişi ekibi tek başına taşıyamaz ve herkesin oyunu katkı yapar. Kişisel rekor bu sınırdan etkilenmez.<br>Köprü sayısı kullanılır, puan değil: puan bölümlerle katlanarak büyür, köprü ise herkesin emeğini adil ölçer.</p>
    <h3>Günün kahramanı ve son olaylar</h3><p>Günün kahramanı o gün ekibine en çok köprü yazan kişidir. Son olaylarda katılımlar, rekorlar, sıralama değişiklikleri ve ekip liderliği görünür.</p>
    <h3>Sadi hakkı</h3><p>Oyun bitince son köprüden 1 canla devam etmeni sağlar. Herkesin yarışta 1 kişisel hakkı vardır. Kişisel hakkını kullandıysan, ekibin hakkı hâlâ duruyorsa onu kullanabilirsin; ekip hakkını ekipten yalnızca bir kişi, bir kez kullanır. Kişisel hakkını kullananın adının yanında Sadi rozeti görünür.</p>
    <h3>Kontenjan ve bitiş</h3><p>Yarışa en fazla ${KONT} kişi katılabilir. Yarış 31 Aralık 23:59'da (İstanbul saati) biter; sonra oynamaya devam edilebilir ama puan ve köprü yazılmaz, tablo sonuç olarak kalır.</p>
    <h3>Veriler</h3><p>Ad, isteğe bağlı küçük fotoğraf, ekip, skorlar, köprü sayıları ve kurtarma kodu ortak bir çevrim içi tabloda (Firebase) tutulur. Bağlantıyı bilen herkes tabloyu görebilir; bu yüzden ad yerine lakap kullanabilirsin, iş bilgisi yazma. Her oyunun sonunda adsız bir özet (bölüm, köprü, ölüm sebepleri, süre) ve oyunda hata olursa hata mesajı kaydedilir. Kendi kaydını Profilim'den silebilirsin.</p>
    <p class="mute" style="font-size:12px">${esc(SEZON)} (güncelleme ${SURUM}) · Ses: telefonda üretilir, dosya yok.</p>
    <button class="btn ghost" id="bBtn">Geri</button></div>`);
  $('#bBtn').onclick=menu;
}
function offView(){ show(`<div style="margin:auto 0;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center"><h1 style="font:700 40px var(--fd);color:var(--acc)">Yılbaşı Yarışı</h1><h2 style="font:700 22px var(--fd)">İnternet bağlantısı yok</h2><p class="soft" style="margin:0">Puanlar kaybolmasın diye oyun yalnızca ortak tabloya bağlıyken açılır.</p><button class="btn" id="tBtn">Tekrar dene</button></div>`); $('#tBtn').onclick=boot; }

async function boot(){
  if(!(await sync())) return offView();
  seasonCheck();
  if(ME&&!S.players[ME]){ ME=''; localStorage.removeItem('yy_id'); }
  splash();
}
addEventListener('online',()=>{ if(!ui.classList.contains('hide')&&/bağlantısı yok/.test(ui.textContent)) boot(); });
if(TEST){ window.__events=[]; window.__G=G; window.__S=()=>S; window.__api={startGame,gameOver,crash,useBirce,spawnAt,bounds,segs,chanOf,inWater,ents:()=>ents,sectionInfo,levelOfSection,firstSectionOf,passBridge}; }
boot();
</script>
